<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XSS Example Input Demo</title>
    <style>
        #favorite-foods-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ff9800;
            border-radius: 8px;
            background-color: #fff3e0;
        }
        
        #favorite-foods-section h2 {
            color: #e65100;
            margin-top: 0;
        }
        
        #food-input-form {
            margin-bottom: 20px;
        }
        
        #food-input {
            padding: 8px 12px;
            border: 1px solid #ffb74d;
            border-radius: 4px;
            width: 300px;
            margin-right: 10px;
        }
        
        #add-food-btn {
            padding: 8px 16px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        #add-food-btn:hover {
            background-color: #f57c00;
        }
        
        #favorite-foods-list {
            list-style-type: none;
            padding: 0;
        }
        
        #favorite-foods-list li {
            background-color: #ffe0b2;
            margin: 5px 0;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ffcc80;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #favorite-foods-list li button {
            background: #ff9800;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 3px;
            cursor: pointer;
        }
        
        #favorite-foods-list li button:hover {
            background: #f57c00;
        }
    </style>
</head>
<body>
    <div id="vulnerable-div"></div>
    <div id="vulnerable-div2"></div>
    <div id="age-result"></div>
    <hr/>
    <!-- New location section -->
    <div id="location-div"></div>
    <div id="location-result"></div>
    <hr/>
    <!-- Favorite Foods Section -->
    <div id="favorite-foods-section">
        <h2>My Favorite Foods</h2>
        <div id="food-input-form">
            <input type="text" id="food-input" placeholder="Enter a food you like..." />
            <button id="add-food-btn">Add Food</button>
        </div>
        <ul id="favorite-foods-list"></ul>
    </div>
    <script src="xss-example.js"></script>
</body>
</html>
